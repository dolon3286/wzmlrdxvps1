services:
  # Start this profile when you want downloads through Gluetun but uploads
  # through the VPS main IP:
  #   COMPOSE_PROFILES=vpn-downloads docker compose up -d
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    profiles: ["vpn-downloads"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-}
      - VPN_TYPE=${VPN_TYPE:-}
      # OpenVPN
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      # Wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESS=${WIREGUARD_ADDRESS:-}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY:-}
      - TZ=${TZ:-Asia/Kolkata}
      - UPDATER_PERIOD=24h
      # Allow the main app container to reach Aria2/qBittorrent inside Gluetun.
      - FIREWALL_INPUT_PORTS=6800,8090
    expose:
      - "6800"
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    restart: on-failure

  download-client:
    build: .
    profiles: ["vpn-downloads"]
    command: >
      bash -lc 'chmod +x setpkgs.sh && ./setpkgs.sh aria2c "" 20 false &&
      qbittorrent-nox -d --profile=/usr/src/app/configs/qbittorrent &&
      tail -f /dev/null'
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./downloads:/usr/src/app/downloads
      - ./configs:/usr/src/app/configs

  app:
    build: .
    command: bash start.sh
    restart: unless-stopped
    environment:
      # Switch app downloads between VPS IP and Gluetun without editing config.py.
      # false/localhost = downloads and uploads use VPS IP.
      # true/gluetun URLs = downloads use Gluetun, uploads keep VPS IP.
      - EXTERNAL_DOWNLOAD_CLIENTS=${APP_EXTERNAL_DOWNLOAD_CLIENTS:-False}
      - ARIA2_RPC_URL=${APP_ARIA2_RPC_URL:-http://localhost:6800/jsonrpc}
      - QBIT_URL=${APP_QBIT_URL:-http://localhost:8090/api/v2/}
    volumes:
      - ./config.py:/usr/src/app/config.py:ro
      - ./accounts:/usr/src/app/accounts
      - ./downloads:/usr/src/app/downloads

    expose:
      - "8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://localhost:8080
    network_mode: "service:app"

