services:
  # Optional VPN only for Aria2 downloads. The app and qBittorrent stay on the
  # normal Docker/VPS network, so uploads and qBittorrent use the VPS IP.
  # Enable with:
  #   COMPOSE_PROFILES=aria2-vpn APP_EXTERNAL_DOWNLOAD_CLIENTS=True docker compose up -d
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    profiles: ["aria2-vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-}
      - VPN_TYPE=${VPN_TYPE:-}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESS=${WIREGUARD_ADDRESS:-}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY:-}
      - TZ=${TZ:-Asia/Kolkata}
      - UPDATER_PERIOD=24h
      - FIREWALL_INPUT_PORTS=6800
    expose:
      - "6800"
    restart: on-failure

  aria2-vpn:
    build: .
    profiles: ["aria2-vpn"]
    command: bash -lc 'chmod +x setpkgs.sh && ./setpkgs.sh aria2c "" 20 false && tail -f /dev/null'
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./downloads:/usr/src/app/downloads
      - ./configs/ac:/usr/src/app/configs/ac

  app:
    build: .
    command: bash start.sh
    restart: unless-stopped
    environment:
      # Switch only Aria2 downloads between VPS IP and Gluetun.
      # qBittorrent and all uploads always stay on this app container/VPS IP.
      - EXTERNAL_DOWNLOAD_CLIENTS=${APP_EXTERNAL_DOWNLOAD_CLIENTS:-False}
      - ARIA2_RPC_URL=${APP_ARIA2_RPC_URL:-}
    volumes:
      - ./config.py:/usr/src/app/config.py:ro
      - ./accounts:/usr/src/app/accounts
      - ./downloads:/usr/src/app/downloads

    expose:
      - "8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://localhost:8080
    network_mode: "service:app"

  # app2:
