<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX-CLOUD | Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;600;700&display=swap');

        /* --- 1. LUXURY GOLD THEME SETTINGS --- */
        :root {
            --bg-color: #050505;        /* Deepest Black */
            --glass-bg: rgba(0, 0, 0, 0.7); /* Dark Glass */
            --primary-gold: #ffd700;    /* Pure Gold */
            --accent-gold: #d4af37;     /* Metallic Gold */
            --pale-gold: #fffacd;       /* Pale Gold */
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo', sans-serif !important;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* --- 2. BACKGROUND IMAGE --- */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Replace this URL with your own image if you want */
            background: url('https://i.ibb.co/BHfFwVfk/japan-background-digital-art.jpg') no-repeat center center/cover;
            
            /* This dims the background so text pops */
            filter: brightness(0.4); 
            z-index: 0;
        }

        /* --- 3. PREMIUM GLASS CARD --- */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            
            /* The Glass Effect */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            padding: 3.5rem;
            border-radius: 20px;
            
            /* Gold Glowing Border */
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            
            animation: contentAppear 1s ease-out;
            max-width: 500px;
            width: 90%;
        }

        @keyframes contentAppear {
            from { 
                opacity: 0; 
                transform: translateY(30px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            
            /* Gold Border & Glow */
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            
            animation: logoSpin 20s linear infinite;
        }

        @keyframes logoSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            
            /* Gold Text Gradient */
            background: linear-gradient(45deg, var(--primary-gold), var(--pale-gold), var(--accent-gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            color: #cccccc;
            font-weight: 300;
        }

        .version {
            font-size: 0.9rem;
            color: var(--primary-gold);
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            flex-direction: column; /* Stack buttons for a cleaner luxury look */
            gap: 1rem;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        /* --- 4. LUXURY BUTTONS --- */
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 1.5rem;
            
            /* Dark button with Gold Border */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--primary-gold);
            
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .button i {
            margin-right: 10px;
        }

        /* Hover Effect: Turns Solid Gold */
        .button:hover {
            background: var(--primary-gold);
            color: #000000; /* Text turns black for contrast */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transform: translateY(-2px);
            border-color: var(--primary-gold);
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-top: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .copyright {
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.5;
            color: var(--text-color);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .content {
                padding: 2rem;
                width: 95%;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-animation"></div>

        <div class="content">
            <img class="logo" src="https://i.ibb.co/FbQZcRDG/1000049402k.jpg" alt="RDX Logo">
            
            <div class="version">WELCOME TO</div>
            <h1><b>RDX-CLOUD</b></h1>
            <p class="subtitle">Experience the next generation of premium service</p>

            <div class="links">
              <a href="https://t.me/rdxmirror" class="button">
                <i class="fab fa-telegram-plane"></i> Join Channel
              </a>
              <a href="https://t.me/+LVy3V_0ON_NmNWY9" class="button">
                <i class="fas fa-comments"></i> Support Group
              </a>
              <a href="https://t.me/Rdx_sss" class="button">
                <i class="fab fa-github"></i> Contact Admin
              </a>
            </div>

            <div class="tagline">MAKE THE RIGHT CHOICE</div>
            <p class="copyright">&copy; 2026 RDX-CLOUD. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
